<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부동산 분석 도구 모음</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-strong: #1c5cab;
    --accent-soft: #cde2fb;
    --green-soft: #e4f2ea;
    --green-ink: #1b7f4d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-strong: #6da7ec;
      --accent-soft: #184f95;
      --green-soft: #16301f;
      --green-ink: #4fbf87;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--page); color: var(--text-primary); line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .wrap { max-width: 860px; width: 100%; }
  header { text-align: center; margin-bottom: 36px; }
  header h1 { font-size: 1.8rem; letter-spacing: -0.01em; }
  header p { color: var(--text-secondary); margin-top: 8px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  a.card {
    display: block; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 26px; text-decoration: none; color: inherit;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.10); }
  .card .icon { font-size: 2.2rem; }
  .card h2 { font-size: 1.2rem; margin: 12px 0 6px; }
  .card p { font-size: 0.92rem; color: var(--text-secondary); }
  .card .tag {
    display: inline-block; margin-top: 14px; font-size: 0.78rem; font-weight: 700;
    padding: 3px 12px; border-radius: 999px;
  }
  .card.blue .tag { background: var(--accent-soft); color: var(--accent-strong); }
  .card.green .tag { background: var(--green-soft); color: var(--green-ink); }
  .card .go { display: block; margin-top: 16px; font-weight: 700; color: var(--accent); font-size: 0.95rem; }

  footer { text-align: center; margin-top: 36px; font-size: 0.78rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 부동산 분석 도구 모음</h1>
    <p>공공임대 자격 진단부터 재개발 사업성 분석까지</p>
  </header>

  <div class="cards">
    <a class="card green" href="sh-rental/">
      <div class="icon">🏢</div>
      <h2>SH 청년 매입임대주택 자격 자가진단</h2>
      <p>2026년 1차 모집공고 기준으로 신청 자격과 순위(1·2·3순위), 가점을 단계별로 확인합니다.</p>
      <span class="tag">청년 · 공공임대</span>
      <span class="go">진단 시작 →</span>
    </a>

    <a class="card blue" href="redevelopment/">
      <div class="icon">🏗️</div>
      <h2>재개발 사업성 분석 플랫폼</h2>
      <p>재개발 절차 개념 정리와 함께, 건축물대장·매매가를 입력해 권리가액·추가분담금·투자점수를 계산합니다.</p>
      <span class="tag">재개발 · 투자 분석</span>
      <span class="go">분석 시작 →</span>
    </a>
  </div>

  <footer>모든 결과는 참고용 추정치이며 법적 효력이 없습니다. 반드시 공고문·고시문 원문과 전문가 검토를 거치세요.</footer>
</div>
</body>
</html>
