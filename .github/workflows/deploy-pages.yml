name: Publish to GitHub Pages

on:
  push:
    branches: [claude/redevelopment-analysis-platform-2dacb7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror branch to gh-pages
        run: git push -f origin HEAD:gh-pages
